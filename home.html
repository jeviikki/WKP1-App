<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Restaurants App</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js" defer></script>
</head>

<body>
  <div class="hero-img">
    <!-- a hero img could be added here -->
    <p>Registered users can...</p>
	<ul>
		<li>Set a cool profile picture</li>
		<li>Select a favorite restaurant</li>
		<li>Save filter preferences</li>
	</ul>
    <!-- TODO these do nothing yet -->
	 <div>
		<button>Register now</button>
    	<button>I have an account</button>
	 </div>
    
  </div>

  <section>

	<div class="section-text">

		<h1>Restaurants</h1>

		<button id="open-filters">Filtering options</button>

		<form id="filter-form">

			<!-- Sort by... -->
			<div class="filtering-option">
			<label for="order">Sort by...</label>
			<select name="order" id="order">
				<option value="">-- Select a sorting method --</option>
				<option value="name">Alphabetical (name)</option>
				<option value="address">Alphabetical (address)</option>
				<!-- TODO <option value="location">Location</option> -->
			</select>
			</div>
			
			<!-- Filter companies -->
			<div class="filtering-option">
			<label for="company">Show me restaurants for...</label>
			<div class="checkbox-group">
				<!-- both checked by default -->
				<input type="checkbox" id="sodexo" name="company" value="sodexo" checked><label for="sodexo">Sodexo</label>
				<input type="checkbox" id="compass-group" name="company" value="compass group" checked><label for="compass-group">Compass Group</label>
			</div>
			</div>

			<input id="filter-btn" type="submit" value="Filter">

		</form>
	</div>

	<table>
		<tr class="tableheader">
		<th><span class="table-icon"></span>Name</th>
		<th><span class="table-icon"></span>Address</th>
		<th><span class="table-icon"></span>City</th>
		<th><span class="table-icon"></span>Company</th>
		</tr>
		<!-- add restaurants here -->
	</table>
  </section>
  
  <!-- modal -->
  <dialog>
    <!-- add restaurant info here when restaurant is clicked -->
  </dialog>
</body>

</html>

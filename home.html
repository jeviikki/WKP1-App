<!DOCTYPE html>
<html lang="en">

<head>
  	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  	<title>Student Restaurants App</title>
  	<link rel="stylesheet" href="css/style.css">
  	<script type="module" src="javascript/main.js" defer></script>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
	 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
	 crossorigin=""/>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
	 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
	 crossorigin=""></script>
	 
</head>

<body>
  <div>
	<!-- a hero img could be added here -->
	<div id="unregistered" class="hero-img">
		<p>If you register, you can add a profile picture and choose your preferred restaurant.</p>
		<!-- TODO these do nothing yet -->
		<div>
			<button>Register now</button>
			<button>I have an account</button>
		</div>
	</div>
	<div id="registered">
		<!-- not implemented yet: once implemented it will fetch registered user data and display it here -->
		<div id="user-avatar">
			<!-- user avatar goes here -->
		</div>
		<div id="user-speech">
			<!-- a script will fill out this information -->
			<blockquote>
				<p><span id="user-name">This user</span>'s favorite restaurant is <span id="user-fav">none of them</span>!</p>
			</blockquote>
		</div>
	</div>
	
  </div>

  <section>

	<div class="section-text">

		<h1>Restaurants</h1>

		<div id="grand-map">

		</div>

		<div class="form-container">

			<h2>Filters</h2>

			<form id="filter-form">

				<!-- Sort by... -->
				<div class="filtering-option">
				<label for="order">Sort by...</label>
				<select name="order" id="order">
					<option value="">-- Select a sorting method --</option>
					<option value="name">Alphabetical (name)</option>
					<option value="address">Alphabetical (address)</option>
					<!-- TODO <option value="location">Location</option> -->
				</select>
				</div>
				
				<!-- Filter companies -->
				<div class="filtering-option">
					<label for="company">Show me restaurants for...</label>
					<div class="checkbox-group">
						<!-- both checked by default -->
						<input type="checkbox" id="sodexo" name="company" value="sodexo" checked><label for="sodexo">Sodexo</label>
						<input type="checkbox" id="compass-group" name="company" value="compass group" checked><label for="compass-group">Compass Group</label>
					</div>
				</div>
				
				<!-- Weekly or daily menus (NOT IMPLEMENTED YET) -->
				<div class="filtering-option">
					<label for="menu-type">Menu types</label>
					<div class="checkbox-group">
						<!-- daily checked by default -->
						<input type="radio" id="daily" name="menu-type" value="daily" checked><label for="daily">Daily</label>
						<input type="radio" id="weekly" name="menu-type" value="weekly group"><label for="weekly">Weekly</label>
					</div>
				</div>

				<input id="filter-btn" type="submit" value="Filter">

			</form>

		</div>
		
	</div>

	<table>
		<tr class="tableheader">
		<th><span class="table-icon"></span>Name</th>
		<th><span class="table-icon"></span>Address</th>
		<th><span class="table-icon"></span>City</th>
		<th><span class="table-icon"></span>Company</th>
		</tr>
		<!-- add restaurants here -->
	</table>
  </section>
  
  <!-- modal -->
  <dialog>
	<!-- add restaurant info here when restaurant is clicked -->
  </dialog>
</body>

</html>
